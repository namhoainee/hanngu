        <div class="logo-icon">龍</div>

    <div>

          <li><a href="dashboard.html" class="admin-sidebar-link"><i class="fas fa-chart-pie"></i> Dashboard</a></li>

          <li><a href="dialogues.html" class="admin-sidebar-link"><i class="fas fa-comments"></i> Quản lý hội thoại</a></li>
          <li><a href="quizzes.html" class="admin-sidebar-link"><i class="fas fa-question-circle"></i> Quản lý Quiz</a></li>
          <li><span class="admin-sidebar-link-disabled"><i class="fas fa-users"></i> Quản lý người dùng <span class="admin-soon-badge">Sắp có</span></span></li>
          <li><span class="admin-sidebar-link-disabled"><i class="fas fa-chart-line"></i> Thống kê <span class="admin-soon-badge">Sắp có</span></span></li>

    <div class="admin-sidebar-footer">
      <a href="../trangchu.html" class="admin-back-site-link"><i class="fas fa-arrow-left"></i> Về trang web</a>
    </div>

  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="admin-sidebar-toggle" id="adminSidebarToggle"><i class="fas fa-bars"></i></button>
        <h1>Quản Lý Bài Học</h1>
      </div>
    </div>

    <div class="admin-content">
      <div class="admin-page-header">
        <h2></h2>
        <button class="btn btn-primary" id="btnAddNew"><i class="fas fa-plus"></i> + Thêm Bài Học</button>
      </div>

      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="modal-overlay" id="formModal">
        <div class="modal-content admin-modal-content">
          <button class="modal-close-btn" data-close-modal>&times;</button>
          <h3 id="formModalTitle">+ Thêm Bài Học</h3>
          <form id="entityForm">
            <div id="formFields"></div>
            <div class="admin-form-actions">
              <button type="button" class="btn btn-secondary" data-close-modal>Hủy</button>
              <button type="submit" class="btn btn-primary">Lưu</button>
            </div>
          </form>
        </div>
      </div>

    </div>

  <script src="../../js/utils/localData.js"></script>
  <script src="../../js/config/config.js"></script>
  <script src="../../js/api/coursesApi.js"></script>
